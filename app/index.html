<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>מחברת חזרה למבחן</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — sticky top bar with two modes (child practice / parent tracking), one centered column (max 1040px),
   cards in wrapping grids; the question card is a single focused sheet with a notebook-square motif. */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f2f8; --border:#e2e6ef; --border-strong:#cfd5e2;
  --text:#151b2c; --muted:#5f687c; --faint:#8b93a5;
  --math:#2563eb; --math-soft:#e7eefe; --geo:#e8590c; --geo-soft:#fdeee4;
  --ok:#2b8a3e; --ok-soft:#e7f6eb; --warn:#c77700; --warn-soft:#fff3d6; --bad:#d9363e; --bad-soft:#fdeced;
  --star:#f5b301; --on-acc:#ffffff; --grid:#e6ebf5;
  --shadow:0 1px 2px rgba(20,27,45,.05),0 4px 16px rgba(20,27,45,.06);
  --display:'Fredoka','Heebo',system-ui,sans-serif;
  --body:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --acc:var(--math); --acc-soft:var(--math-soft);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1018; --surface:#141a25; --surface-2:#1a2230; --border:#252e3f; --border-strong:#334058;
  --text:#e9edf5; --muted:#9aa4b8; --faint:#6f7a8f;
  --math:#6f9dff; --math-soft:#18264a; --geo:#ff9152; --geo-soft:#3a2214;
  --ok:#5ad27a; --ok-soft:#12301c; --warn:#ffc53d; --warn-soft:#3a2d0c; --bad:#ff6b70; --bad-soft:#3b171a;
  --star:#ffc53d; --on-acc:#0c1018; --grid:#1d2535;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1018; --surface:#141a25; --surface-2:#1a2230; --border:#252e3f; --border-strong:#334058;
  --text:#e9edf5; --muted:#9aa4b8; --faint:#6f7a8f;
  --math:#6f9dff; --math-soft:#18264a; --geo:#ff9152; --geo-soft:#3a2214;
  --ok:#5ad27a; --ok-soft:#12301c; --warn:#ffc53d; --warn-soft:#3a2d0c; --bad:#ff6b70; --bad-soft:#3b171a;
  --star:#ffc53d; --on-acc:#0c1018; --grid:#1d2535;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.math{--acc:var(--math);--acc-soft:var(--math-soft)} .geo{--acc:var(--geo);--acc-soft:var(--geo-soft)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px;font-family:var(--display);font-weight:600;font-size:1.15rem}
.logo{width:32px;height:32px;border-radius:9px;background:var(--math);color:var(--on-acc);display:grid;place-items:center;font-size:1.1rem;font-family:var(--display)}
.seg{margin-inline-start:auto;display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.page{max-width:1040px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem)} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);padding:10px 18px;font-weight:700;cursor:pointer;font-size:1rem;transition:transform .12s,background .12s,border-color .12s}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.lg{padding:14px 26px;font-size:1.1rem;border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.hero-main{padding:24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero-main::after{content:"";position:absolute;inset:auto auto -1px -1px;width:180px;height:120px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;mask-image:linear-gradient(45deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(45deg,#000,transparent 70%);pointer-events:none}
.hero-side{padding:20px;display:flex;flex-direction:column;gap:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtile{text-align:start;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.qtile:hover{border-color:var(--acc);transform:translateY(-2px)}
.qtile b{font-family:var(--display);font-weight:600;font-size:1.02rem}
.qtile span{font-size:.85rem;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:14px}
.section-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{text-align:start;padding:16px;border-radius:16px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.tcard-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tcard h3{font-size:1.08rem}
.tcard p{font-size:.88rem;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.meter-row{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.strong{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--warn-soft);color:var(--warn)} .pill.weak{background:var(--bad-soft);color:var(--bad)}
.st-strong{--st:var(--ok)} .st-mid{--st:var(--warn)} .st-weak{--st:var(--bad)} .st-new{--st:var(--faint)}
.meter.st i{background:var(--st)}

/* topic page */
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.crumbs button{background:none;border:0;color:var(--acc);cursor:pointer;padding:0;font-weight:600}
.topic-head{padding:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.learn{padding:24px;display:flex;flex-direction:column;gap:14px;max-width:100%}
.learn h3{margin-top:6px;color:var(--acc)}
.learn p,.learn li{max-width:68ch}
.learn ul,.learn ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px}
.ex{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.tip{background:var(--acc-soft);border-radius:12px;padding:12px 16px}
.learn svg{max-width:100%;height:auto}

/* quiz */
.quiz{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead .count{margin-inline-start:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:.9rem}
.tpill{font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s ease}
.qcard{padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:18px}
.prompt{font-size:1.25rem;font-weight:700;line-height:1.5}
.visual{display:flex;justify-content:center;overflow-x:auto;max-width:100%}
.visual svg{max-width:100%;height:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choices.wide{grid-template-columns:1fr}
.choices.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{min-height:56px;padding:12px 14px;border-radius:14px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:1.15rem;font-weight:600;transition:border-color .12s,background .12s,transform .12s;display:flex;align-items:center;justify-content:center;text-align:center}
.choices.wide .choice{justify-content:flex-start;text-align:start;font-size:1.08rem}
.choice:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.choice svg{max-width:100%;height:auto}
.choice.ltrc{font-family:var(--display);font-size:1.45rem}
.ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.ansinput{font-family:var(--display);font-size:1.8rem;width:7.5ch;text-align:center;padding:8px 10px;border-radius:14px;border:2px solid var(--border-strong);background:var(--surface);color:var(--text)}
.ansinput:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.ansinput.right{border-color:var(--ok);background:var(--ok-soft)} .ansinput.wrong{border-color:var(--bad);background:var(--bad-soft)}
.unit{color:var(--muted);font-weight:600}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;animation:pop .25s ease}
.fb.ok{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.bad{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.fb.info{background:var(--surface-2);border:1px solid var(--border)}
.fb-title{font-family:var(--display);font-weight:600;font-size:1.15rem}
.fb.ok .fb-title{color:var(--ok)} .fb.bad .fb-title{color:var(--bad)}
.explain{line-height:1.75}
.qactions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* result */
.result{padding:28px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.bigscore{font-family:var(--display);font-size:3.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stars{font-size:2.2rem;letter-spacing:6px;color:var(--border-strong)} .stars b{color:var(--star);font-weight:400}
.breakdown{width:100%;display:flex;flex-direction:column;gap:8px;text-align:start}
.bd-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:12px;align-items:center;font-size:.95rem}

/* parent dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:.85rem;color:var(--muted)}
.panel{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.focus-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.focus{border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.focus small{color:var(--muted)}
.ttable{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) 110px minmax(90px,1.2fr) 64px 56px 28px;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--border);font-size:.95rem;font-variant-numeric:tabular-nums}
.trow.head{border-top:0;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.trow .tn{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.trow button.exp{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:4px}
.skills{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding:4px 18px 10px;background:var(--surface-2);border-radius:12px}
.skrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,180px) 80px;gap:12px;align-items:center;font-size:.88rem}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)} .trend.flat{color:var(--faint)}
.mist{display:flex;flex-direction:column;gap:8px}
.mrow{border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.92rem}
.mrow .q{grid-column:1/-1;font-weight:500}
.mrow .ans{display:flex;gap:16px;flex-wrap:wrap}
.mrow .ans span b{font-weight:700}
.mrow .given{color:var(--bad)} .mrow .corr{color:var(--ok)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:120px minmax(0,1fr) 70px 60px;gap:10px;padding:9px 4px;border-top:1px solid var(--border);font-size:.92rem;font-variant-numeric:tabular-nums;align-items:center}
.hrow:first-child{border-top:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;max-width:320px}
.field input{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text)}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sync,var(--faint))}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--bad-soft)}

/* --- shared content classes used by question modules --- */
.m{unicode-bidi:isolate;direction:ltr;font-family:var(--display);font-weight:500;white-space:nowrap}
.big{display:flex;justify-content:center;font-size:clamp(1.8rem,7vw,2.6rem);padding:6px 0}
.big .m{font-weight:600}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.4em;padding:0 .2em;border:2.5px dashed var(--acc);border-radius:10px;color:var(--acc);background:var(--acc-soft);vertical-align:middle;font-size:.9em}
.circle{display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.4em;border:2.5px solid var(--acc);border-radius:50%;color:transparent;vertical-align:middle;margin:0 .15em}
.words{font-family:var(--display);font-size:clamp(1.3rem,5vw,1.8rem);font-weight:600;padding:10px 18px;border-radius:14px;background:var(--acc-soft);color:var(--text);text-align:center}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.chip{font-family:var(--display);font-size:1.5rem;font-weight:600;min-width:2.6em;padding:6px 12px;border-radius:12px;border:2px solid var(--border);background:var(--surface);text-align:center;font-variant-numeric:tabular-nums}
.chip.miss{border-style:dashed;border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.pv{border-collapse:collapse;margin:8px 0;font-variant-numeric:tabular-nums}
.pv th,.pv td{border:1px solid var(--border-strong);padding:4px 14px;text-align:center}
.pv th{font-size:.82rem;color:var(--muted);font-weight:700;background:var(--surface-2)}
.pv td{font-family:var(--display);font-size:1.3rem;font-weight:600}
.vert{display:grid;grid-template-columns:repeat(var(--cols),2.1em);font-family:var(--display);font-size:clamp(1.6rem,6vw,2rem);font-weight:600;line-height:1;direction:ltr;background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);background-size:2.1em 2.1em;border:1.5px solid var(--grid);padding:0}
.vert span{height:2.1em;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.vert .op{color:var(--acc)}
.vert .rule{border-bottom:3px solid var(--text)}
.vert .ans{background:var(--acc-soft)}
.s-line{stroke:var(--text)} .s-soft{stroke:var(--border-strong)} .s-acc{stroke:var(--acc)} .s-ok{stroke:var(--ok)} .s-bad{stroke:var(--bad)}
.f-acc{fill:var(--acc)} .f-accsoft{fill:var(--acc-soft)} .f-text{fill:var(--text)} .f-muted{fill:var(--muted)} .f-sheet{fill:var(--surface)} .f-ok{fill:var(--ok)} .f-bad{fill:var(--bad)}
svg text{font-family:var(--display)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .trow{grid-template-columns:minmax(0,1fr) 96px 52px 28px}
  .trow .c-bar,.trow .c-trend{display:none}
}
@media (max-width:480px){
  .seg button{padding:6px 10px;font-size:.85rem}
  .brand .bt{display:none}
  .hrow{grid-template-columns:86px minmax(0,1fr) 54px}
  .hrow .c-time{display:none}
  .bd-row{grid-template-columns:minmax(0,1fr) 80px 46px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
// ---------- shared helpers for question modules ----------
var TOPICS = [], TOPIC = {};
function registerTopic(t){ if(TOPIC[t.id]) return; TOPICS.push(t); TOPIC[t.id] = t; }
function R(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function P(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function M(s){ return '<bdi class="m" dir="ltr">'+s+'</bdi>'; }

function heb(n){
  if(n===0) return 'אפס'; if(n===1000) return 'אלף';
  const p=[], h=Math.floor(n/100), r=n%100;
  if(h) p.push(HEB_HUND[h]);
  if(r>=20){ p.push(HEB_TENS[Math.floor(r/10)]); if(r%10) p.push(HEB_UNITS[r%10]); }
  else if(r>=10) p.push(HEB_TEENS[r-10]);
  else if(r>0) p.push(HEB_UNITS[r]);
  if(p.length>1) p[p.length-1] = 'ו'+p[p.length-1];
  return p.join(' ');
}

}

      skill: isMul ? 'גורם חסר (כפל וחילוק)' : 'מחובר/מחסר חסר',
      type: 'input',
      prompt: 'איזה מספר חסר במקום סימן השאלה?',
      visual: BIG(vis),
      answer: x,
      answerText: String(x),
      hint,
      explain
    };
  }

  function eqCompareNums() {
    let a, b;
    const t = R(1, 8);
    if (t === 1) { // same digits, swapped tens/units
      const h = R(1, 9), d1 = R(1, 9);
      let d2 = R(0, 9); if (d2 === d1) d2 = (d1 + 3) % 10;
      a = h * 100 + d1 * 10 + d2; b = h * 100 + d2 * 10 + d1;
    } else if (t === 2) { // zero in tens: 409 vs 490
      const h = R(1, 9), d = R(1, 9);
      a = h * 100 + d; b = h * 100 + d * 10;
    } else if (t === 3) { // different number of digits
      a = R(50, 99); b = R(100, 130);
    } else if (t === 4) { // equal
      a = b = R(10, 999);
    } else if (t === 5) { // same hundreds and tens
      const base = R(1, 99) * 10;
      a = base + R(0, 9); b = base + R(0, 9);
    } else if (t === 6) { // differ in hundreds, tens bigger in smaller one
      const h = R(1, 8);
      a = h * 100 + R(80, 99); b = (h + 1) * 100 + R(0, 20);
    } else {
      a = R(10, 999); b = R(10, 999);
    }
    if (Math.random() < 0.5) [a, b] = [b, a];
    const ans = cmpVal(a, b);
    const da = String(a), db = String(b);
    let why;
    if (ans === 'eq') {
      why = `<p>שני המספרים זהים: אותן מאות, אותן עשרות ואותן יחידות — לכן הם שווים.</p>`;
    } else if (da.length !== db.length) {
      const [lo, hi] = a < b ? [a, b] : [b, a];
      why = `<p>ל־${hi} יש ${String(hi).length} ספרות ול־${lo} יש רק ${String(lo).length}. מספר עם יותר ספרות הוא גדול יותר.</p>`;
    } else {
      const names = da.length === 3 ? ['מאות', 'עשרות', 'יחידות'] : ['עשרות', 'יחידות'];
      let i = 0; while (da[i] === db[i]) i++;
      const same = i > 0 ? `<p>${names.slice(0, i).join(' ו')} — שווים.</p>` : '';
      why = `<p>משווים מהספרה השמאלית (הכי גדולה):</p>${same}
        <p>ב${names[i]}: ${M(`${da[i]} ${SYM[cmpVal(+da[i], +db[i])]} ${db[i]}`)}, ולכן ${a} ${SYMWORD[ans]}${b}.</p>`;
    }
    return {
      skill: 'השוואת מספרים',
      type: 'choice', ltr: true,
      prompt: 'איזה סימן מתאים בעיגול?',
      visual: BIG(`${a} ${CIRC} ${b}`),
      choices: cmpChoices,
      answer: ans,
      answerText: `${a} ${SYM[ans].replace('&lt;', '<').replace('&gt;', '>')} ${b}`,
      hint: 'הפה הפתוח של הסימן פונה תמיד אל המספר הגדול יותר.',
      explain: why + `<p>${M(`${a} ${SYM[ans]} ${b}`)}</p>`
    };
  }

  function mkExpr() {
    const k = P(['+', '-', 'x']);
    if (k === '+') { const a = R(5, 80), b = R(3, 40); return { s: `${a} + ${b}`, v: a + b }; }
    if (k === '-') { const a = R(20, 99), b = R(3, a - 5); return { s: `${a} ${MINUS} ${b}`, v: a - b }; }
    const a = R(2, 10), b = R(2, 10); return { s: `${a} × ${b}`, v: a * b };
  }
  function eqCompareExpr() {
    const L = mkExpr();
    let Rt;
    const t = R(1, 3);
    if (t === 1) { // number on the right, close to value
      const v = Math.max(0, L.v + P([-3, -2, -1, 0, 0, 1, 2, 3]));
      Rt = { s: String(v), v };
    } else if (t === 2) { // another expression with same type
      Rt = mkExpr();
    } else { // swapped / tweaked same expression -> often equal
      const parts = L.s.split(' ');
      if (parts[1] === '+' || parts[1] === '×') {
        const a = +parts[0], b = +parts[2];
        const b2 = Math.random() < 0.5 ? b : b + P([-1, 1]);
        Rt = parts[1] === '+' ? { s: `${b2} + ${a}`, v: a + b2 } : { s: `${b2} × ${a}`, v: a * b2 };
      } else {
        const a = +parts[0], b = +parts[2];
        Rt = { s: `${a + 1} ${MINUS} ${b + 1}`, v: a - b };
      }
    }
    const ans = cmpVal(L.v, Rt.v);
    const lines = [];
    lines.push(`<p>מחשבים כל צד בנפרד:</p>`);
    lines.push(`<p>צד שמאל: ${M(`${L.s} = ${L.v}`)}</p>`);
    lines.push(Rt.s === String(Rt.v) ? `<p>צד ימין: ${Rt.v}</p>` : `<p>צד ימין: ${M(`${Rt.s} = ${Rt.v}`)}</p>`);
    lines.push(`<p>${M(`${L.v} ${SYM[ans]} ${Rt.v}`)}, ולכן ${M(`${L.s} ${SYM[ans]} ${Rt.s}`)}</p>`);
    return {
      skill: 'השוואת תרגילים',
      type: 'choice', ltr: true,
      prompt: 'פתרו כל צד, ובחרו איזה סימן מתאים בעיגול.',
      visual: BIG(`${L.s} ${CIRC} ${Rt.s}`),
      choices: cmpChoices,
      answer: ans,
      answerText: `${L.s} ${SYM[ans].replace('&lt;', '<').replace('&gt;', '>')} ${Rt.s}`,
      hint: 'קודם חשבו כמה יוצא בכל צד, ורק אחר כך השוו.',
      explain: lines.join('')
    };
  }

  function eqIneq() {
    const op = P(['+', '+', '-']);
    const rel = P(['gt', 'gt', 'lt']);
    const a = R(2, 15);
    let t, bnd; // bnd = value of ? that makes both sides equal
    if (op === '+') { bnd = R(8, 60); t = bnd + a; } else { t = R(5, 50); bnd = t + a; }
    const expr = (x) => (op === '+' ? `${x} + ${a}` : `${x} ${MINUS} ${a}`);
    const val = (x) => (op === '+' ? x + a : x - a);
    let correct, dis;
    if (rel === 'gt') {
      correct = bnd + R(1, 6);
      dis = [bnd, bnd - 1, bnd - R(2, 6)];
    } else {
      correct = bnd - R(1, 6);
      dis = [bnd, bnd + 1, bnd + R(2, 6)];
    }
    if (op === '-') { correct = Math.max(correct, a); dis = dis.filter((d) => d >= a); }
    dis = dis.filter((d) => d >= 0 && (rel === 'gt' ? !(val(d) > t) : !(val(d) < t)));
    const choices = uniq(correct, dis, 4);
    const s = rel === 'gt' ? '&gt;' : '&lt;';
    const word = rel === 'gt' ? 'גדול מ־' : 'קטן מ־';
    return {
      skill: 'אי־שוויון עם נעלם',
      type: 'choice', ltr: true,
      prompt: 'איזה מספר מתאים במקום סימן השאלה, כדי שהתרגיל יהיה נכון?',
      visual: BIG(`${expr(BL)} ${s} ${t}`),
      choices,
      answer: correct,
      answerText: String(correct),
      hint: `קודם מצאו איזה מספר נותן בדיוק ${t}. אחר כך חשבו: צריך יותר ממנו או פחות?`,
      explain: `<p>קודם מוצאים את המספר שנותן בדיוק ${t}: ${M(`${expr(bnd)} = ${t}`)}</p>
        <p>אבל ${bnd} לא מתאים! עם ${bnd} יוצא בדיוק ${t} — זה <b>שווה</b> ל־${t}, ואנחנו צריכים ${word}${t}.</p>
        <p>לכן צריך מספר ${rel === 'gt' ? 'גדול' : 'קטן'} מ־${bnd}: ${M(`${expr(correct)} = ${val(correct)}`)}, ו־${M(`${val(correct)} ${s} ${t}`)} ✔</p>`
    };
  }

  registerTopic({
    id: 'eq',
    sub: 'math',
    name: 'משוואות ואי־שוויונים',
    desc: 'מספר חסר, ושימוש בסימנים ' + M('&lt; &gt; ='),
    learn: `
      <h3>מספר חסר</h3>
      <p>בתרגיל ${M(`${BL} + 6 = 15`)} מחפשים מספר שאם נוסיף לו 6 נקבל 15.</p>
      <p>משתמשים ב<b>פעולה ההפוכה</b>:</p>
      <ul>
        <li>חיבור ↔ חיסור: ${M(`${BL} + 6 = 15`)} ← ${M(`15 ${MINUS} 6 = 9`)}</li>
        <li>כפל ↔ חילוק: ${M(`4 × ${BL} = 28`)} ← ${M('28 : 4 = 7')}</li>
        <li>${M(`${BL} ${MINUS} 5 = 12`)} ← ${M('12 + 5 = 17')}</li>
        <li>${M(`${BL} : 3 = 6`)} ← ${M('6 × 3 = 18')}</li>
      </ul>
      <div class="tip">תמיד אפשר לבדוק: מציבים את התשובה במקום ה־? ורואים אם התרגיל נכון.</div>
      <h3>הסימנים ${M('&lt; &gt; =')}</h3>
      <ul>
        <li>${M('3 &lt; 8')} — שלוש <b>קטן מ</b>שמונה</li>
        <li>${M('8 &gt; 3')} — שמונה <b>גדול מ</b>שלוש</li>
        <li>${M('5 = 5')} — חמש <b>שווה ל</b>חמש</li>
      </ul>
      <div class="tip">הפה הפתוח של הסימן "אוכל" תמיד את המספר הגדול יותר.</div>
      <h3>איך משווים מספרים?</h3>
      <p>קודם סופרים ספרות: למספר עם יותר ספרות — הוא גדול יותר (${M('99 &lt; 100')}).</p>
      <p>אם יש אותו מספר ספרות — משווים משמאל: קודם מאות, אחר כך עשרות, ואז יחידות.</p>
      <div class="ex">${M('345 &lt; 354')} — המאות שוות (3), ובעשרות ${M('4 &lt; 5')}.</div>
      <h3>השוואת תרגילים</h3>
      <p>פותרים כל צד, ואז משווים את התוצאות.</p>
      <div class="ex">${M('7 × 3 ◯ 20')} ← ${M('7 × 3 = 21')}, ו־${M('21 &gt; 20')}, לכן ${M('7 × 3 &gt; 20')}</div>
      <h3>אי־שוויון עם נעלם</h3>
      <p>בתרגיל ${M(`${BL} + 6 &gt; 20`)}: המספר 14 נותן בדיוק 20 (${M('14 + 6 = 20')}) — זה <b>שווה</b>, לא גדול!</p>
      <p>לכן צריך מספר גדול מ־14, למשל 15, 16, 17...</p>
    `,
    skills: ['מחובר/מחסר חסר', 'גורם חסר (כפל וחילוק)', 'השוואת מספרים', 'השוואת תרגילים', 'אי־שוויון עם נעלם'],
    gen: () => {
      const r = Math.random();
      if (r < 0.4) return eqMissing();
      if (r < 0.6) return eqCompareNums();
      if (r < 0.8) return eqCompareExpr();
      return eqIneq();
    }
  });

  /* =====================================================================
     2. ישר המספרים
     ===================================================================== */
  const NL = { W: 400, H: 84, x0: 24, x1: 352, y: 46, n: 10 };
  const tx = (i) => NL.x0 + (i * (NL.x1 - NL.x0)) / NL.n;

  function lineCfg() {
    const c = P([
      { a: 0, s: 1 }, { a: 0, s: 2 }, { a: 0, s: 5 }, { a: 0, s: 10 }, { a: 0, s: 100 },
      { a: R(1, 8) * 100, s: 10 }, { a: 40, s: 2 }, { a: 0, s: 20 }, { a: 100, s: 5 },
      { a: R(1, 8) * 10, s: 1 }, { a: R(1, 4) * 100, s: 20 }
    ]);
    const mode = P(['ends', 'ends', 'ends', 'mid', 'first2']);
    const labels = mode === 'ends' ? [0, 10] : mode === 'mid' ? [0, 5, 10] : [0, 1];
    return { a: c.a, s: c.s, b: c.a + 10 * c.s, labels, val: (i) => c.a + i * c.s };
  }

  function lineSVG(cfg, arrowAt) {
    const parts = [];
    parts.push(`<line class="s-line" stroke-width="2.5" x1="${NL.x0 - 10}" y1="${NL.y}" x2="${NL.W - 12}" y2="${NL.y}"/>`);
    parts.push(`<polygon class="f-text" points="${NL.W - 14},${NL.y - 7} ${NL.W - 2},${NL.y} ${NL.W - 14},${NL.y + 7}"/>`);
    for (let i = 0; i <= NL.n; i++) {
      const x = tx(i);
      const lab = cfg.labels.includes(i);
      parts.push(`<line class="s-line" stroke-width="2" x1="${x}" y1="${NL.y - (lab ? 10 : 8)}" x2="${x}" y2="${NL.y + (lab ? 10 : 8)}"/>`);
      if (lab) parts.push(`<text class="f-text" font-family="inherit" font-size="16" text-anchor="middle" x="${x}" y="${NL.y + 30}">${cfg.val(i)}</text>`);
    }
    if (arrowAt != null) {
      const x = tx(arrowAt);
      parts.push(`<line class="s-acc" stroke-width="3" stroke-linecap="round" x1="${x}" y1="6" x2="${x}" y2="${NL.y - 18}"/>`);
      parts.push(`<polygon class="f-acc" points="${x - 7},${NL.y - 20} ${x + 7},${NL.y - 20} ${x},${NL.y - 11}"/>`);
    }
    return parts.join('');
  }
  const svgWrap = (inner, extra = '') =>
    `<svg viewBox="0 0 ${NL.W} ${NL.H}" width="100%" style="max-width:560px;display:block;margin:0 auto" dir="ltr" ${extra}>${inner}</svg>`;

  function countText(cfg, target) {
    // count from the nearest labelled tick
    let best = cfg.labels[0];
    for (const l of cfg.labels) if (Math.abs(l - target) < Math.abs(best - target)) best = l;
    const seq = [];
    const dir = target >= best ? 1 : -1;
    for (let i = best; dir > 0 ? i <= target : i >= target; i += dir) seq.push(cfg.val(i));
    const jumps = Math.abs(target - best);
    return `<p>סופרים ${dir > 0 ? 'קדימה' : 'אחורה'} מ־${cfg.val(best)}, בקפיצות של ${cfg.s}: ${seq.join(', ')}.</p>
      <p>${jumps === 1 ? 'קפיצה אחת' : `${jumps} קפיצות`} ${dir > 0 ? 'ימינה' : 'שמאלה'} מ־${cfg.val(best)} ← ${cfg.val(target)}</p>`;
  }
  function stepText(cfg) {
    const i = cfg.labels[0], j = cfg.labels[cfg.labels.length - 1];
    const vi = cfg.val(i), vj = cfg.val(j), k = j - i;
    if (k === 1) return `<p>בין ${vi} ל־${vj} יש קפיצה אחת בלבד, ולכן כל קפיצה היא ${M(`${vj} ${MINUS} ${vi} = ${cfg.s}`)}.</p>`;
    return `<p>מ־${vi} עד ${vj} יש ${k} קפיצות שוות (ספרו את הרווחים בין השנתות).</p>
      <p>המרחק כולו: ${M(`${vj} ${MINUS} ${vi} = ${vj - vi}`)}, ומחלקים ל־${k} קפיצות: ${M(`${vj - vi} : ${k} = ${cfg.s}`)}.</p>`;
  }

  function lineRead() {
    const cfg = lineCfg();
    const free = [];
    for (let i = 1; i < 10; i++) if (!cfg.labels.includes(i)) free.push(i);
    const t = P(free);
    const v = cfg.val(t);
    return {
      skill: 'קריאת מספר מהישר',

      prompt: 'איזה מספר מסמן החץ?',
      visual: svgWrap(lineSVG(cfg, t)),
      answer: v,

      hint: 'קודם מצאו בכמה גדל המספר בכל קפיצה בין שתי שנתות, ואחר כך ספרו קפיצות.',
      explain: stepText(cfg) + countText(cfg, t)
    };
  }

  function lineJump() {
    const cfg = lineCfg();
    const s = cfg.s;
    const cands = [1, 2, 5, 10, 20, 50, 100, s * 2, s * 10, cfg.b - cfg.a].filter((x) => x !== s);
    return {
      skill: 'גודל הקפיצה',
      type: 'choice',
      prompt: 'בכמה גדל המספר בכל קפיצה משנתה לשנתה?',
      visual: svgWrap(lineSVG(cfg, null)),
      choices: uniq(s, cands, 4),
      answer: s,
      answerText: String(s),
      hint: 'ספרו כמה קפיצות (רווחים) יש בין שני המספרים הכתובים.',
      explain: stepText(cfg)
    };
  }

  function linePlace() {
    const cfg = lineCfg();
    const free = [];
    for (let i = 1; i < 10; i++) if (!cfg.labels.includes(i)) free.push(i);
    const t = P(free);
    const target = cfg.val(t);
    return {
      skill: 'סימון מספר על הישר',
      type: 'custom',
      prompt: `סמנו על ישר המספרים את המספר ${target}. לחצו על השנתה המתאימה.`,
      answerText: String(target),
      hint: 'מצאו קודם בכמה גדל המספר בכל קפיצה, ואז ספרו קפיצות מהמספר הקרוב.',
      explain: stepText(cfg) + countText(cfg, t),
      mount(el) {
        const NS = 'http://www.w3.org/2000/svg';
        el.innerHTML = svgWrap(lineSVG(cfg, null) +
          `<rect x="0" y="0" width="${NL.W}" height="${NL.H}" fill="transparent"/>` +
          `<g class="nl-marks"></g>`,
          `tabindex="0" role="slider" aria-label="ישר המספרים" aria-valuemin="${cfg.a}" aria-valuemax="${cfg.b}"`);
        const svg = el.querySelector('svg');
        svg.style.touchAction = 'none';
        svg.style.cursor = 'pointer';
        svg.style.userSelect = 'none';
        const marks = svg.querySelector('.nl-marks');
        let idx = null, locked = false, dragging = false;
        const mkMarker = (i, cls, label) => {
          const g = document.createElementNS(NS, 'g');
          const x = tx(i);
          g.innerHTML = `<polygon class="${cls}" points="${x - 8},${NL.y - 24} ${x + 8},${NL.y - 24} ${x},${NL.y - 12}"/>` +
            `<circle class="${cls}" cx="${x}" cy="${NL.y}" r="7"/>` +
            (label != null ? `<text class="${cls}" font-family="inherit" font-size="16" font-weight="700" text-anchor="middle" x="${x}" y="${NL.y - 30}">${label}</text>` : '');
          return g;
        };
        const draw = () => {
          marks.innerHTML = '';
          if (idx != null) marks.appendChild(mkMarker(idx, 'f-acc'));
          svg.setAttribute('aria-valuenow', idx == null ? '' : String(cfg.val(idx)));
        };
        const toIdx = (evt) => {
          let x;
          const m = svg.getScreenCTM && svg.getScreenCTM();
          if (m && svg.createSVGPoint) {
            const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
            x = p.matrixTransform(m.inverse()).x;
          } else {
            const r = svg.getBoundingClientRect();
            x = ((evt.clientX - r.left) / r.width) * NL.W;
          }
          const i = Math.round(((x - NL.x0) / (NL.x1 - NL.x0)) * NL.n);
          return Math.max(0, Math.min(NL.n, i));
        };
        svg.addEventListener('pointerdown', (e) => {
          if (locked) return;
          e.preventDefault();
          dragging = true;
          try { svg.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
          idx = toIdx(e); draw(); svg.focus && svg.focus({ preventScroll: true });
        });
        svg.addEventListener('pointermove', (e) => {
          if (locked || !dragging) return;
          const i = toIdx(e); if (i !== idx) { idx = i; draw(); }
        });
        const stop = () => { dragging = false; };
        svg.addEventListener('pointerup', stop);
        svg.addEventListener('pointercancel', stop);
        svg.addEventListener('keydown', (e) => {
          if (locked) return;
          let d = 0;
          if (e.key === 'ArrowRight' || e.key === 'ArrowUp') d = 1;
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') d = -1;
          else if (e.key === 'Home') { idx = 0; draw(); e.preventDefault(); return; }
          else if (e.key === 'End') { idx = NL.n; draw(); e.preventDefault(); return; }
          else return;
          e.preventDefault();
          idx = idx == null ? 5 : Math.max(0, Math.min(NL.n, idx + d));
          draw();
        });
        return {
          value: () => (idx == null ? null : cfg.val(idx)),
          lock: () => { locked = true; dragging = false; svg.style.cursor = 'default'; svg.removeAttribute('tabindex'); },
          reveal: (ok) => {
            marks.innerHTML = '';
            if (ok) {
              marks.appendChild(mkMarker(t, 'f-ok', target));
            } else {
              if (idx != null) marks.appendChild(mkMarker(idx, 'f-bad'));
              marks.appendChild(mkMarker(t, 'f-ok', target));
            }
          },
          describe: (v) => (v == null ? 'לא סומן' : `סומן: ${v}`)
        };
      },
      check: (v) => v === target
    };
  }

  const learnCfg = { a: 0, s: 5, b: 50, labels: [0, 10], val: (i) => i * 5 };
  registerTopic({

  /* =====================================================================
     3. חיבור וחיסור עם המרה
     ===================================================================== */
  const PL = ['יחידות', 'עשרות', 'מאות'];
  const PL1 = ['יחידה אחת', 'עשרת אחת', 'מאה אחת'];
  const digs = (n) => String(n).split('').reverse().map(Number); // units first

  function vertHTML(a, b, op, res) {
    const N = Math.max(String(a).length, String(b).length, String(res).length) + 1;
    const row = (n, cls) => {
      const s = String(n);
      const cells = [];
      for (let i = 1; i < N; i++) {
        const d = s[s.length - (N - i)];
        cells.push(`<span${cls ? ` class="${cls}"` : ''}>${d == null ? '' : d}</span>`);
      }
      return cells;
    };
    const r1 = ['<span></span>', ...row(a, '')];
    const r2 = [`<span class="op rule">${op}</span>`, ...row(b, 'rule')];
    const r3 = Array.from({ length: N }, () => '<span class="ans"></span>');
    return `<div class="vert" dir="ltr" style="--cols:${N}">${[...r1, ...r2, ...r3].join('')}</div>`;
  }

  function hasCarry(a, b) {
    return (a % 10) + (b % 10) >= 10 || (a % 100) + (b % 100) >= 100;
  }
  function hasBorrow(a, b) {
    return a % 10 < b % 10 || a % 100 < b % 100;
  }

  function genAdd() {
    for (let k = 0; k < 200; k++) {
      const t = R(1, 4);
      let a, b;
      if (t === 1) { a = R(10, 99); b = R(10, 99); }
      else if (t === 2) { a = R(100, 899); b = R(10, 99); }
      else if (t === 3) { a = R(100, 799); b = R(100, 999 - a); }
      else { a = R(1, 8) * 100 + R(90, 99); b = R(10, 30); } // e.g. 395 + 8 -> 399→400 style
      if (a + b > 999 || !hasCarry(a, b)) continue;
      if (Math.random() < 0.5) [a, b] = [b, a];
      return [a, b];
    }
    return [478, 256];
  }
  function genSub(zero) {
    for (let k = 0; k < 200; k++) {
      let a, b;
      if (zero) {
        const h = R(1, 9), u = R(0, 8);
        a = h * 100 + u;
        b = R(0, h - 1) * 100 + R(0, 9) * 10 + R(u + 1, 9);
        if (b < 10) continue;
      } else {
        const t = R(1, 3);
        if (t === 1) { a = R(20, 99); b = R(10, a - 1); }
        else if (t === 2) { a = R(100, 999); b = R(10, 99); }
        else { a = R(200, 999); b = R(100, a - 1); }
        if (Math.floor(a / 10) % 10 === 0 && a >= 100 && a % 10 < b % 10) continue; // that's the zero case
      }
      if (a <= b || !hasBorrow(a, b)) continue;
      return [a, b];
    }
    return zero ? [503, 278] : [72, 38];
  }

  function addExplain(a, b) {
    const A = digs(a), B = digs(b), n = Math.max(A.length, B.length);
    let carry = 0;
    const out = [];
    for (let i = 0; i < n; i++) {
      const x = A[i] || 0, y = B[i] || 0, s = x + y + carry;
      const terms = (carry ? [carry] : []).concat(i < A.length ? [x] : []).concat(i < B.length ? [y] : []);
      const expr = terms.length > 1 ? M(`${terms.join(' + ')} = ${s}`) : String(s);
      let tail;
      if (s >= 10 && i < n - 1) tail = `← כותבים ${s % 10} ומעבירים 1 ל${PL[i + 1]}`;
      else if (s >= 10) tail = `← כותבים ${s}`;
      else tail = `← כותבים ${s}`;
      out.push(`<li>${PL[i]}: ${expr} ${tail}</li>`);
      carry = s >= 10 ? 1 : 0;
    }
    return `<ul>${out.join('')}</ul><p>התוצאה: ${M(`${a} + ${b} = ${a + b}`)}</p>
      <p>בדיקה: ${M(`${a + b} ${MINUS} ${b} = ${a}`)} ✔</p>`;
  }

  function subExplain(a, b) {
    const T = digs(a), B = digs(b);
    const out = [];
    let zeroCross = false;
    for (let i = 0; i < T.length; i++) {
      const y = B[i] || 0;
      const had = i < B.length;
      if (T[i] < y) {
        if (T[i + 1] > 0) {
          T[i + 1] -= 1; T[i] += 10;
          out.push(`<li>${PL[i]}: ${T[i] - 10} קטן מ־${y}, אז פורטים ${PL1[i + 1]} ל־10 ${PL[i]}. עכשיו ${M(`${T[i]} ${MINUS} ${y} = ${T[i] - y}`)} (ב${PL[i + 1]} נשארו ${T[i + 1]})</li>`);
        } else {
          zeroCross = true;
          // T[i+1] === 0 : borrow from i+2
          T[i + 2] -= 1; T[i + 1] = 9; T[i] += 10;
          out.push(`<li>${PL[i]}: ${T[i] - 10} קטן מ־${y}, וב${PL[i + 1]} יש 0 — אין מה לפרוט! פורטים ${PL1[i + 2]} ל־10 ${PL[i + 1]}, ואז ${PL1[i + 1]} ל־10 ${PL[i]}. עכשיו יש ${T[i]} ${PL[i]}, ${T[i + 1]} ${PL[i + 1]} ו־${T[i + 2]} ${PL[i + 2]}. ${M(`${T[i]} ${MINUS} ${y} = ${T[i] - y}`)}</li>`);
        }
      } else {
        const r = T[i] - y;
        const isLead = i === T.length - 1;
        if (isLead && r === 0 && !had) {
          if (T.length > 1) out.push(`<li>${PL[i]}: לא נשאר כלום, לא כותבים 0 בהתחלה</li>`);
        } else if (!had) out.push(`<li>${PL[i]}: אין מה להחסיר — נשארו ${r}</li>`);
        else out.push(`<li>${PL[i]}: ${M(`${T[i]} ${MINUS} ${y} = ${r}`)}${isLead && r === 0 && T.length > 1 ? ' (לא כותבים 0 בהתחלה)' : ''}</li>`);
      }
    }
    return {
      zeroCross,
      html: `<ul>${out.join('')}</ul><p>התוצאה: ${M(`${a} ${MINUS} ${b} = ${a - b}`)}</p>
        <p>בדיקה: ${M(`${a - b} + ${b} = ${a}`)} ✔</p>`
    };
  }

  function addsubGen() {
    const r = Math.random();
    const vertical = Math.random() < 0.7;
    let a, b, op, res, skill, explain;
    if (r < 0.45) {
      [a, b] = genAdd(); op = '+'; res = a + b; skill = 'חיבור עם המרה';

    } else {

      const e = subExplain(a, b);
      skill = e.zeroCross ? 'פריטה דרך אפס' : 'חיסור עם פריטה';
      explain = e.html;
    }
    const pre = vertical ? '<p>פותרים במאונך, מתחילים מהיחידות (מימין):</p>' : '<p>אפשר לכתוב במאונך ולפתור מהיחידות:</p>';
    return {
      skill,
      type: 'input',
      prompt: vertical ? 'פתרו את התרגיל במאונך וכתבו את התוצאה.' : 'פתרו את התרגיל.',

      answer: res,

      hint: op === '+'
        ? 'התחילו מהיחידות. אם יוצא 10 או יותר — כותבים רק את היחידות ומעבירים 1 לעמודה הבאה.'
        : 'התחילו מהיחידות. אם הספרה למעלה קטנה מהספרה למטה — פורטים מהעמודה שמשמאל.',
      explain: pre + explain
    };
  }

     4. כפל וחילוק

  function mulExplain(a, b) {
    const c = a * b;
    if (a === 0 || b === 0) return `<p>כל מספר כפול 0 שווה 0 (אם אין קבוצות, או שבכל קבוצה אין כלום — אין כלום). ${M(`${a} × ${b} = 0`)}</p>`;
    if (a === 1 || b === 1) return `<p>כל מספר כפול 1 שווה לעצמו. ${M(`${a} × ${b} = ${c}`)}</p>`;
    if (a <= 5) {
      return `<p>${M(`${a} × ${b}`)} פירושו ${a} פעמים ${b}:</p><p>${M(`${Array(a).fill(b).join(' + ')} = ${c}`)}</p>`;
    }
    if (b === 10) return `<p>כפול 10 — מוסיפים 0 בסוף המספר: ${M(`${a} × 10 = ${c}`)}</p>`;
    if (a === 10) return `<p>${M(`10 × ${b}`)} — ${b} עשרות: ${M(`10 × ${b} = ${c}`)}</p>`;
    const r = a - 5;
    return `<p>${M(`${a} × ${b}`)} פירושו ${a} פעמים ${b}. דרך קלה: מפרקים ${M(`${a} = 5 + ${r}`)}:</p>
      <p>${M(`5 × ${b} = ${5 * b}`)}, ${M(`${r} × ${b} = ${r * b}`)}</p>
      <p>${M(`${5 * b} + ${r * b} = ${c}`)}</p>`;
  }

      <p>${M(`${a} × ${b} = ${c}`)}, ולכן ${M(`${c} : ${a} = ${b}`)}</p>`;
    return {
      skill: 'חילוק',
      type: 'input',
      prompt: 'כמה זה?',
      visual: BIG(`${c} : ${a} = ${BL}`),
      answer: b,

  }

// Geometry module: angle types, drawing angles, degrees<->type, angles in polygons.
(()=>{
  const DEG = Math.PI / 180;
  const f1 = x => Math.round(x * 10) / 10;
  const pt = p => `${f1(p[0])},${f1(p[1])}`;
  // math angle (counter-clockwise, degrees) -> svg coords (y down)
  const pol = (cx, cy, r, a) => [cx + r * Math.cos(a * DEG), cy - r * Math.sin(a * DEG)];
  const TYPES = ['acute', 'right', 'obtuse', 'straight'];
  const typeOf = d => d === 90 ? 'right' : d === 180 ? 'straight' : d < 90 ? 'acute' : 'obtuse';
  const NAME = t => AN[t];
  const PLUR = {acute: 'חדות', right: 'ישרות', obtuse: 'קהות', straight: 'שטוחות'};
  const DEF = {
    acute: `קטנה מזווית ישרה (פחות מ־${M('90°')})`,
    right: `בדיוק ${M('90°')} — כמו פינה של דף`,
    obtuse: `גדולה מזווית ישרה וקטנה מזווית שטוחה (בין ${M('90°')} ל־${M('180°')})`,
    straight: `בדיוק ${M('180°')} — שתי השוקיים יוצרות קו ישר`,
  };
  const dg = d => M(d + '°');

  // wedge + outline paths for an angle that starts at math-angle a1 and opens counter-clockwise by deg
  function markerPaths(cx, cy, a1, deg, r) {
    if (deg === 90) {
      const s = r * 0.6;
      const p1 = pol(cx, cy, s, a1), p3 = pol(cx, cy, s, a1 + 90);
      const p2 = [p1[0] + p3[0] - cx, p1[1] + p3[1] - cy];
      return {
        wedge: `M${cx},${cy} L${pt(p1)} L${pt(p2)} L${pt(p3)} Z`,
        line: `M${pt(p1)} L${pt(p2)} L${pt(p3)}`,
      };
    }
    const p1 = pol(cx, cy, r, a1), pm = pol(cx, cy, r, a1 + deg / 2), p2 = pol(cx, cy, r, a1 + deg);
    const arc = `A${r} ${r} 0 0 0 ${pt(pm)} A${r} ${r} 0 0 0 ${pt(p2)}`;
    return {wedge: `M${cx},${cy} L${pt(p1)} ${arc} Z`, line: `M${pt(p1)} ${arc}`};
  }
  function marker(cx, cy, a1, deg, r) {
    const m = markerPaths(cx, cy, a1, deg, r);
    return `<path d="${m.wedge}" class="f-accsoft" stroke="none"/>` +
      `<path d="${m.line}" class="s-acc" fill="none" stroke-width="2.2" stroke-linejoin="round"/>`;
  }

  // Two rays from a vertex with an arc+soft wedge marker (square if 90)
  function angleSVG(deg, o = {}) {
    const rot = o.rot || 0, flip = !!o.flip, L = o.L || 46, w = o.w || 200;
    const r2 = flip ? rot - deg : rot + deg;
    const start = flip ? rot - deg : rot;
    const e1 = pol(0, 0, L, rot), e2 = pol(0, 0, L, r2);
    return `<svg viewBox="-56 -56 112 112" width="100%" style="max-width:${w}px;display:block;margin:auto" role="img" aria-label="זווית">` +
      marker(0, 0, start, deg, deg === 90 ? 20 : 16) +
      `<line x1="0" y1="0" x2="${f1(e1[0])}" y2="${f1(e1[1])}" class="s-line" stroke-width="3" stroke-linecap="round"/>` +
      `<line x1="0" y1="0" x2="${f1(e2[0])}" y2="${f1(e2[1])}" class="s-line" stroke-width="3" stroke-linecap="round"/>` +
      `<circle cx="0" cy="0" r="3.2" class="f-text"/></svg>`;
  }

  // degree pickers avoiding ambiguous sizes (within 8° of 90 or 180)

  const typeChoices = () => TYPES.map(t => ({label: NAME(t), value: t}));

  const card = (t, deg) => `<div class="ex" style="text-align:center">` +
    angleSVG(deg, {rot: t === 'straight' ? 0 : 10, w: 140}) +
    `<b>זווית ${NAME(t)}</b><br>${DEF[t]}</div>`;

    skills: ['זיהוי זווית בציור', 'הגדרות'],
    learn: `<p><b>זווית</b> נוצרת כששתי קרניים (<b>שוקיים</b>) יוצאות מאותה נקודה — <b>הקדקוד</b>. גודל הזווית נמדד ב<b>מעלות</b> (°).</p>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
${card('acute', 45)}${card('right', 90)}${card('obtuse', 135)}${card('straight', 180)}

    skills: ['סוג זווית מסומנת', 'ספירת זוויות לפי סוג', 'איזו זווית היא…'],
    learn: `<p>בכל <b>מצולע</b> (משולש, מרובע, מחומש, משושה…) יש זוויות — בכל <b>קדקוד</b> נפגשות שתי צלעות ויוצרות זווית. כדי לדבר על זווית מסוימת, נותנים לקדקודים שמות באותיות: א, ב, ג…</p>
<div class="ex">${shapeSVG({pts: [[40, 135], [180, 135], [140, 45], [40, 45]], A: [90, 90, 90, 90], W: 220, H: 170}, 0)}
<p style="text-align:center">בטרפז הזה: זווית א וזווית ד ישרות, זווית ב חדה, וזווית ג קהה.</p></div>
<h3>איך בודקים כל זווית?</h3>
<ul><li>מסתכלים על שתי הצלעות שיוצאות מהקדקוד.</li><li>משווים לפינה של דף: קטנה ממנה — <b>חדה</b>, שווה לה — <b>ישרה</b>, גדולה ממנה — <b>קהה</b>.</li></ul>
<div class="tip">בריבוע ובמלבן כל ארבע הזוויות ישרות. במשולש יכולה להיות לכל היותר זווית ישרה אחת או זווית קהה אחת!</div>`,
    gen() {
      const S = makeShape(), n = S.pts.length;
      const k = R(1, 3);
      if (k === 3) {
        const cand = ['obtuse', 'acute', 'right'].filter(t => S.types.filter(x => x === t).length === 1);
        if (cand.length) {
          const t = P(cand), i = S.types.indexOf(t);
          const others = shuffle(LET.slice(0, n).filter(l => l !== LET[i])).slice(0, 3);
          return {
            skill: 'איזו זווית היא…', type: 'choice',
            prompt: `איזו זווית היא ${NAME(t)}?`, visual: shapeSVG(S, null),
            choices: shuffle([LET[i], ...others]).map(l => ({label: 'זווית ' + l, value: l})), answer: LET[i],
            hint: 'בדקו כל קדקוד בעזרת פינה של דף.',
            explain: `נבדוק כל זווית:${listAngles(S)}רק זווית ${LET[i]} היא ${NAME(t)}.`,
            answerText: 'זווית ' + LET[i],
            _angles: S.A,
          };
        }
      }
      if (k === 2) {
        const t = P(['right', 'acute', 'obtuse']);
        const c = S.types.filter(x => x === t).length;
        return {
          skill: 'ספירת זוויות לפי סוג', type: 'input',
          prompt: `כמה זוויות ${PLUR[t]} יש ב${POLY[n]} הזה?`, visual: shapeSVG(S, null),
          answer: c,
          hint: `ב${POLY[n]} יש ${n} זוויות. בדקו כל אחת.`,
          explain: `נבדוק את כל ${n} הזוויות:${listAngles(S)}` +
            (c === 0 ? `אין כאן אף זווית ${NAME(t)} — התשובה היא 0.` : `יש ${c === 1 ? `זווית ${NAME(t)} אחת` : c + ' זוויות ' + PLUR[t]}.`),
          answerText: String(c),
          _angles: S.A,
        };
      }
      // bias toward varied types for the marked angle
      const t = P([...new Set(S.types)]);
      const i = P(S.types.map((x, j) => x === t ? j : -1).filter(j => j >= 0));
      return {
        skill: 'סוג זווית מסומנת', type: 'choice',
        prompt: `איזו זווית היא זווית ${LET[i]} המסומנת?`, visual: shapeSVG(S, i),
        choices: ['acute', 'right', 'obtuse'].map(x => ({label: NAME(x), value: x})), answer: t,
        hint: 'השוו את הזווית המסומנת לפינה של דף.',
        explain: `זווית ${LET[i]} היא ${approx(S.A[i])}, ` +
          (t === 'right' ? 'בדיוק כמו פינה של דף (ולכן מסומנת בריבוע) — <b>ישרה</b>.' :
            t === 'acute' ? 'קטנה מזווית ישרה — <b>חדה</b>.' : 'גדולה מזווית ישרה וקטנה משטוחה — <b>קהה</b>.'),
        answerText: 'זווית ' + NAME(t),
        _angles: S.A,
      };
    },
  });
})();

(function(){
const {useState,useEffect,useRef,useMemo,useSyncExternalStore} = React;
const html = htm.bind(React.createElement);

// ---------- storage: localStorage always, artifact db when available ----------
const LS_KEY='mz-sessions-v1', LS_NAME='mz-name';
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

const Store = {
  db:null, status:'local', version:0, listeners:new Set(), uploading:new Set(),
  sessions: lsGet(LS_KEY,[]), name: lsGet(LS_NAME,''),
  subscribe(f){ Store.listeners.add(f); return ()=>Store.listeners.delete(f); },
  snap(){ return Store.version; },
  emit(){ Store.version++; Store.listeners.forEach(f=>f()); },
  persist(){ lsSet(LS_KEY, Store.sessions.slice(0,500)); },
  async init(){
    if(!window.claude || typeof window.claude.use!=='function') return;
    Store.status='loading'; Store.emit();
    let db=null; try{ db = await window.claude.use('db'); }catch(e){ db=null; }
    if(!db){ Store.status='local'; Store.emit(); return; }
    Store.db=db;
    const timer=setTimeout(()=>{ if(Store.status==='loading'){ Store.status='local'; Store.emit(); } },10000);
    db.collection('sessions').orderBy('t','desc').limit(500).onSnapshot(snap=>{
      clearTimeout(timer);
      const remote = snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      const ids = new Set(remote.map(s=>s.id));
      const pending = Store.sessions.filter(s=>s.pending && !ids.has(s.id));
      pending.forEach(s=>Store.upload(s));
      Store.sessions = remote.concat(pending).sort((a,b)=>b.t-a.t);
      Store.persist(); Store.status='synced'; Store.emit();
    }, ()=>{ clearTimeout(timer); Store.status='local'; Store.emit(); });
    db.doc('settings/main').onSnapshot(s=>{
      if(s.exists){ const d=s.data()||{}; if(typeof d.name==='string' && d.name!==Store.name){ Store.name=d.name; lsSet(LS_NAME,d.name); Store.emit(); } }
    }, ()=>{});
  },
  upload(s){
    if(!Store.db || Store.uploading.has(s.id)) return;
    Store.uploading.add(s.id);
    const {pending, id, ...data} = s;
    Store.db.doc('sessions/'+id).set(data).then(()=>{
      const x = Store.sessions.find(v=>v.id===id); if(x){ delete x.pending; Store.persist(); }
    }).catch(()=>{}).finally(()=>Store.uploading.delete(id));
  },
  addSession(s){
    s.id = 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    s.pending = true;
    Store.sessions = [s].concat(Store.sessions);
    Store.persist(); Store.emit(); Store.upload(s);
  },
  setName(n){
    Store.name=n; lsSet(LS_NAME,n); Store.emit();
    if(Store.db) Store.db.doc('settings/main').set({name:n}).catch(()=>{});
  },
  async reset(){
    const list = Store.sessions.slice();
    Store.sessions=[]; Store.persist(); Store.emit();
    if(Store.db){ for(const s of list){ try{ await Store.db.doc('sessions/'+s.id).delete(); }catch(e){} } }
  }
};
function useStore(){ useSyncExternalStore(Store.subscribe, Store.snap); return Store; }

// ---------- stats ----------
const rate = arr => arr.length ? arr.filter(x=>x.ok).length/arr.length : null;
const STATUS = {
  strong:{label:'שליטה טובה', cls:'strong'}, mid:{label:'בדרך', cls:'mid'}, weak:{label:'צריך תרגול', cls:'weak'},
  new:{label:'עוד לא תורגל', cls:'new'}, few:{label:'מעט נתונים', cls:'new'}
};
function statusOf(acc,n){ if(!n) return 'new'; if(n<4) return 'few'; if(acc>=0.85) return 'strong'; if(acc>=0.6) return 'mid'; return 'weak'; }
function computeStats(sessions){
  const per={}; TOPICS.forEach(t=>per[t.id]={id:t.id,items:[],skills:{}});
  const all=[];
  sessions.slice().sort((a,b)=>a.t-b.t).forEach(s=>(s.items||[]).forEach(it=>{
    const x=Object.assign({},it,{t:s.t}); all.push(x);
    const p=per[it.topic]; if(!p) return; p.items.push(x); (p.skills[it.skill]=p.skills[it.skill]||[]).push(x);
  }));
  Object.values(per).forEach(p=>{
    p.n=p.items.length; const rec=p.items.slice(-20); p.acc=rate(rec); p.status=statusOf(p.acc,p.n);
    const last=p.items.slice(-8), prev=p.items.slice(-16,-8);
    p.trend = (last.length>=4 && prev.length>=4) ? rate(last)-rate(prev) : null;
    const t=TOPIC[p.id];
    const names = (t.skills||[]).slice(); Object.keys(p.skills).forEach(k=>{ if(!names.includes(k)) names.push(k); });
    p.skillList = names.map(k=>{ const arr=p.skills[k]||[]; const r=arr.slice(-12); return {name:k,n:arr.length,acc:rate(r),status:statusOf(rate(r),arr.length)}; });
    p.ms = p.items.reduce((a,x)=>a+(x.ms||0),0);
  });
  return {per,all};
}
function weakestSkill(p){
  const c = p.skillList.filter(s=>s.n>=2 && s.acc<0.85).sort((a,b)=>a.acc-b.acc);
  return c.length ? c[0].name : null;
}

// ---------- plans ----------
function practicePlan(tid, stats, focus){
  const t=TOPIC[tid]; const sk=shuffle(t.skills||[]); const plan=[];
  const weak = focus && stats ? weakestSkill(stats.per[tid]) : null;
  for(let k=0;k<10;k++){
    let skill = sk.length ? sk[k%sk.length] : null;
    if(weak && k%2===0) skill = weak;
    plan.push({tid,skill});
  }
  return plan;
}
function smartPlan(stats,total){
  total = total||12;
  const w = TOPICS.map(t=>{ const p=stats.per[t.id]; return p.n<4 ? 1.2 : (1-p.acc)*2.5+0.15; });
  const sum = w.reduce((a,b)=>a+b,0); const plan=[];
  for(let i=0;i<total;i++){
    let r=Math.random()*sum, k=0; while(r>w[k] && k<w.length-1){ r-=w[k]; k++; }
    const t=TOPICS[k]; const ws = weakestSkill(stats.per[t.id]);
    plan.push({tid:t.id, skill: (ws && Math.random()<0.6) ? ws : P(t.skills||[null])});
  }
  return plan;
}
function examPlan(sub){
  const ids=TOPICS.filter(t=>sub==='all'||t.sub===sub).map(t=>t.id);
  const per= sub==='math'?2 : sub==='geo'?3 : 1; let plan=[];
  ids.forEach(id=>{ for(let k=0;k<per;k++) plan.push({tid:id}); });
  if(sub==='all') while(plan.length<20) plan.push({tid:P(ids)});
  return shuffle(plan);
}
function makeQ(item){
  const t=TOPIC[item.tid]; let q=null;
  for(let k=0;k<30;k++){
    try{ const c=t.gen(); if(c){ q=c; if(!item.skill || c.skill===item.skill) break; } }catch(e){ console.error(e); }
  }
  return q || {type:'input',prompt:'כמה זה '+M('2 + 2')+'?',answer:4,answerText:'4',explain:M('2 + 2 = 4'),skill:''};
}

// ---------- small utils ----------
function strip(h){ h=String(h||'').replace(/<(\/?)(span|div|td|th|tr|br|p|li)\b[^>]*>/gi,' <$1$2> ').replace(/<span class="blank">\?<\/span>/g,' ? '); try{ return (new DOMParser().parseFromString('<div>'+h+'</div>','text/html').body.textContent||'').replace(/\s+/g,' ').trim(); }catch(e){ return ''; } }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isHeb = s => /[\u0590-\u05FF]/.test(String(s||''));
const dirWrap = h => isHeb(h) ? h : '<bdi dir="ltr">'+h+'</bdi>';
const pct = a => a==null ? '—' : Math.round(a*100)+'%';
const fmtDate = t => { const d=new Date(t); return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+' · '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); };
const PRAISE=['כל הכבוד!','מצוין!','יפה מאוד!','נכון! אלופים','בדיוק!','מעולה!'];
const TRY_AGAIN=['כמעט! נסו שוב','לא בדיוק, עוד ניסיון אחד','אופס, בדקו שוב'];
const SUBJ={math:'חשבון',geo:'הנדסה'};
const MODE={practice:'תרגול',smart:'תרגול חכם',exam:'מבחן לדוגמה'};
function starsFor(r){ return r>=0.9?3 : r>=0.7?2 : r>=0.5?1 : 0; }
function Stars({n}){ return html`<div class="stars" aria-label=${n+' כוכבים מתוך 3'}>${[0,1,2].map(i=> i<n ? html`<b key=${i}>★</b>` : html`<span key=${i}>★</span>`)}</div>`; }
function Html({h,cls,tag}){ return React.createElement(tag||'div',{className:cls,dangerouslySetInnerHTML:{__html:h}}); }

// ---------- Quiz ----------
function Quiz({cfg,onExit,onFinish}){
  const {plan,mode}=cfg;
  const [i,setI]=useState(0);
  const [q,setQ]=useState(()=>makeQ(plan[0]));
  const [tries,setTries]=useState(0);
  const [done,setDone]=useState(false);
  const [fb,setFb]=useState(null);
  const [wrong,setWrong]=useState([]);
  const [picked,setPicked]=useState(null);
  const [val,setVal]=useState('');
  const [inState,setInState]=useState('');
  const items=useRef([]), t0=useRef(Date.now()), ctl=useRef(null), box=useRef(null), firstGiven=useRef(null), nextBtn=useRef(null), inp=useRef(null);
  const T=TOPIC[plan[i].tid];
  const singleTries = mode==='exam';

  useEffect(()=>{
    ctl.current=null;
    if(q.type==='custom' && box.current){ box.current.innerHTML=''; try{ ctl.current=q.mount(box.current); }catch(e){ console.error(e); } }
    if(q.type==='input' && inp.current && window.matchMedia('(pointer:fine)').matches) inp.current.focus();
  },[i]);
  useEffect(()=>{ if(done && nextBtn.current) nextBtn.current.focus({preventScroll:true}); },[done]);

  function judge(v,given){
    if(done) return;
    let ok;
    if(q.type==='input'){
      const s=String(v).replace(/[\s,]/g,'');
      if(s===''||isNaN(Number(s))){ setFb({kind:'info',title:'כתבו מספר ואז לחצו על "בדיקה"'}); return; }
      ok = Number(s)===q.answer; given=s;
    } else if(q.type==='choice'){
      ok = String(v)===String(q.answer); setPicked(String(v));
    } else {
      if(v===null||v===undefined){ setFb({kind:'info',title:'קודם צריך לסמן את התשובה בציור'}); return; }
      ok=!!q.check(v); try{ given = ctl.current&&ctl.current.describe ? ctl.current.describe(v) : String(v); }catch(e){ given=String(v); }
    }
    if(ok) return finish(true, tries===0, given);
    if(!singleTries && tries===0){
      setTries(1); firstGiven.current=given;
      if(q.type==='choice') setWrong(w=>w.concat(String(v)));
      if(q.type==='input'){ setInState('wrong'); setTimeout(()=>inp.current&&inp.current.select(),0); }
      setFb({kind:'bad',title:P(TRY_AGAIN),body:q.hint||'קראו שוב את השאלה בעיון ונסו עוד פעם.'});
      return;
    }
    finish(false,false,given);
  }
  function finish(correct,firstTry,given){
    setDone(true);
    try{ ctl.current&&ctl.current.lock&&ctl.current.lock(); ctl.current&&ctl.current.reveal&&ctl.current.reveal(correct); }catch(e){}
    if(q.type==='input') setInState(correct?'right':'wrong');
    const vis = q.visual ? (q.visual.indexOf('<svg')>=0 ? '' : ' '+strip(q.visual)) : '';
    items.current.push({
      topic:plan[i].tid, skill:q.skill||'', ok:firstTry, tries:tries+1, ms:Math.min(Date.now()-t0.current,600000),
      q:(strip(q.prompt)+vis).slice(0,220),
      given:String(firstGiven.current!=null?firstGiven.current:(given!=null?given:'')).slice(0,80),
      correct:String(q.answerText!=null?q.answerText:(q.answer!=null?q.answer:'')).slice(0,80)
    });
    const ansTxt = q.answerText!=null ? q.answerText : q.answer;
    setFb(correct
      ? {kind:'ok',title: firstTry ? P(PRAISE) : 'נכון! הצלחה בניסיון השני', body:q.explain}
      : {kind:'bad',title:'לא נורא, ככה לומדים!', body:'<p><b>התשובה הנכונה: '+(q.type==='choice'&&q.answerText==null ? '' : dirWrap(esc(ansTxt)))+'</b></p>'+(q.explain||'')});
  }
  function next(){
    if(i+1>=plan.length){ onFinish(items.current); return; }
    const n=i+1; setQ(makeQ(plan[n])); setI(n); setTries(0); setDone(false); setFb(null); setWrong([]); setPicked(null); setVal(''); setInState('');
    firstGiven.current=null; t0.current=Date.now(); window.scrollTo({top:0,behavior:'smooth'});
  }

  let area=null;
  if(q.type==='choice'){
    const ch=(q.choices||[]).map(c=> (c!==null && typeof c==='object') ? c : {label:String(c),value:c});
    const lay = q.layout==='wide'?' wide' : q.layout==='pics'?' pics':'';
    area = html`<div class=${'choices'+lay} role="group">${ch.map((c,k)=>{
      const v=String(c.value); const isAns = v===String(q.answer);
      let cls='choice'+(q.ltr?' ltrc':'');
      if(wrong.includes(v)) cls+=' wrong';
      if(done && isAns) cls+=' right';
      if(done && picked===v && !isAns) cls+=' wrong';
      return html`<button key=${i+'-'+k} class=${cls} dir=${q.ltr?'ltr':null} disabled=${done||wrong.includes(v)} onClick=${()=>judge(c.value, strip(c.label)||String(c.value))} dangerouslySetInnerHTML=${{__html:c.label}}></button>`;
    })}</div>`;
  } else if(q.type==='input'){
    area = html`<form class="ansrow" onSubmit=${e=>{e.preventDefault(); judge(val);}}>
      <label class="unit" for="ans-input">התשובה:</label>
      <input id="ans-input" ref=${inp} class=${'ansinput '+inState} dir="ltr" inputmode="numeric" autocomplete="off" enterkeyhint="done" value=${val} disabled=${done}
        onInput=${e=>{ setVal(e.target.value.replace(/[^\d\-]/g,'')); if(inState==='wrong') setInState(''); }} />
      ${q.unit ? html`<span class="unit">${q.unit}</span>` : null}
    </form>`;
  } else {
    area = html`<div key=${'custom'+i} ref=${box} class="visual"></div>`;
  }

  return html`<div class=${'quiz '+T.sub}>
    <div class="qhead">
      <button class="btn ghost" onClick=${onExit}>✕ יציאה</button>
      <span class="tpill">${T.name}</span>
      <span class="count">שאלה ${i+1} מתוך ${plan.length}</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax=${plan.length} aria-valuenow=${i+(done?1:0)}><i style=${{width:((i+(done?1:0))/plan.length*100)+'%'}}></i></div>
    <div class="card qcard">
      <${Html} cls="prompt" h=${q.prompt} />
      ${q.visual ? html`<${Html} cls="visual" h=${q.visual} />` : null}
      ${area}
      ${fb ? html`<div class=${'fb '+fb.kind} role="status">
        <div class="fb-title">${fb.title}</div>
        ${fb.body ? html`<${Html} cls="explain" h=${fb.body} />` : null}
      </div>` : null}
      <div class="qactions">
        <span class="muted" style=${{fontSize:'.85rem'}}>${singleTries ? 'מבחן: ניסיון אחד לכל שאלה' : (tries>0 && !done ? 'ניסיון שני' : '')}</span>
        ${done
          ? html`<button ref=${nextBtn} class="btn primary lg" onClick=${next}>${i+1>=plan.length ? 'לסיכום' : 'לשאלה הבאה ←'}</button>`
          : (q.type!=='choice' ? html`<button class="btn primary lg" onClick=${()=>judge(q.type==='input'?val:(ctl.current?ctl.current.value():null))}>בדיקה</button>` : null)}
      </div>
    </div>
  </div>`;
}

// ---------- Result ----------
function Result({res,onAgain,onHome,onParent,name}){
  const total=res.items.length, score=res.items.filter(x=>x.ok).length, r=total?score/total:0, st=starsFor(r);
  const byT={}; res.items.forEach(x=>{ (byT[x.topic]=byT[x.topic]||[]).push(x); });
  const msg = r>=0.9 ? 'וואו! מוכנים למבחן' : r>=0.7 ? 'עבודה טובה! עוד קצת תרגול וזה שם' : r>=0.5 ? 'התחלה טובה. כדאי לתרגל עוד' : 'כדאי לחזור על ההסבר ולתרגל שוב';
  return html`<div class="quiz">
    <div class="card result">
      <div class="eyebrow">${MODE[res.mode]} · ${res.title}</div>
      <${Stars} n=${st} />
      <div class="bigscore"><bdi dir="ltr">${score} / ${total}</bdi></div>
      <h2>${msg}${name? ', '+name : ''}</h2>
      ${Object.keys(byT).length>1 ? html`<div class="breakdown">
        ${Object.entries(byT).map(([tid,arr])=>{ const a=rate(arr); const s=statusOf(a,4); return html`<div class=${'bd-row '+TOPIC[tid].sub} key=${tid}>
          <span>${TOPIC[tid].name}</span>
          <div class=${'meter st st-'+s}><i style=${{width:(a*100)+'%'}}></i></div>
          <bdi dir="ltr" class="muted">${arr.filter(x=>x.ok).length}/${arr.length}</bdi>
        </div>`; })}
      </div>` : null}
      <div class="row" style=${{justifyContent:'center'}}>
        <button class="btn primary lg" onClick=${onAgain}>עוד סבב</button>
        <button class="btn lg" onClick=${onHome}>לכל הנושאים</button>
        <button class="btn ghost" onClick=${onParent}>לוח מעקב</button>
      </div>
    </div>
  </div>`;
}

// ---------- Home ----------
function TopicCard({t,p,onOpen}){
  const s=STATUS[p.status];
  return html`<button class=${'tcard '+t.sub} onClick=${()=>onOpen(t.id)}>
    <div class="tcard-top"><h3>${t.name}</h3><span class=${'pill '+s.cls}>${s.label}</span></div>
    <${Html} tag="p" h=${t.desc} />
    <div class=${'meter st st-'+(p.status==='few'?'new':p.status)}><i style=${{width:((p.acc||0)*100)+'%'}}></i></div>
    <div class="meter-row"><span>${p.n ? 'הצלחה '+pct(p.acc) : 'עוד לא התחלנו'}</span><span>${p.n ? p.n+' שאלות' : ''}</span></div>
  </button>`;
}
function Home({stats,name,go}){
  const weak = TOPICS.map(t=>stats.per[t.id]).filter(p=>p.status==='weak'||p.status==='mid').sort((a,b)=>a.acc-b.acc).slice(0,3);
  const practiced = TOPICS.filter(t=>stats.per[t.id].n>0).length;
  return html`<div class="page">
    <div class="hero">
      <div class="card hero-main">
        <div class="eyebrow">חזרה למבחן · חשבון והנדסה</div>
        <h1>${name ? 'היי '+name+'! מתאמנים למבחן?' : 'היי! מוכנים להתאמן למבחן?'}</h1>
        <p class="muted">בחרו נושא, קראו את ההסבר ותרגלו. בכל שאלה יש שני ניסיונות, ואחרי כל תשובה מופיע הסבר.</p>
        <div class="row"><button class="btn primary lg" onClick=${()=>go.smart()}>להתחיל תרגול חכם</button>
        <span class="muted" style=${{fontSize:'.88rem'}}>12 שאלות, יותר מהנושאים שצריך לחזק</span></div>
      </div>
      <div class="card hero-side">
        <div class="eyebrow">מבחן לדוגמה</div>
        <div class="quick">
          <button class="qtile math" onClick=${()=>go.exam('math')}><b>חשבון</b><span>18 שאלות</span></button>
          <button class="qtile geo" onClick=${()=>go.exam('geo')}><b>הנדסה</b><span>12 שאלות</span></button>
          <button class="qtile" style=${{gridColumn:'1/-1'}} onClick=${()=>go.exam('all')}><b>מבחן משולב</b><span>20 שאלות מכל הנושאים, ניסיון אחד לכל שאלה</span></button>
        </div>
        <p class="muted" style=${{fontSize:'.85rem'}}>תורגלו ${practiced} מתוך ${TOPICS.length} נושאים${weak.length? ' · כדאי לחזק: '+weak.map(p=>TOPIC[p.id].name).join(', ') : ''}</p>
      </div>
    </div>
    ${['math','geo'].map(sub=>html`<section class=${'section '+sub} key=${sub}>
      <div class="section-h"><span class="dot"></span><h2>${SUBJ[sub]}</h2><span class="muted">${TOPICS.filter(t=>t.sub===sub).length} נושאים</span></div>
      <div class="grid">${TOPICS.filter(t=>t.sub===sub).map(t=>html`<${TopicCard} key=${t.id} t=${t} p=${stats.per[t.id]} onOpen=${go.topic} />`)}</div>
    </section>`)}
  </div>`;
}

// ---------- Topic page ----------
function TopicPage({tid,stats,go}){
  const t=TOPIC[tid], p=stats.per[tid], s=STATUS[p.status];
  return html`<div class=${'page '+t.sub}>
    <div class="crumbs"><button onClick=${go.home}>כל הנושאים</button><span>/</span><span>${SUBJ[t.sub]}</span></div>
    <div class="card topic-head">
      <div style=${{display:'flex',flexDirection:'column',gap:'6px',minWidth:0}}>
        <div class="row"><h1>${t.name}</h1><span class=${'pill '+s.cls}>${s.label}</span></div>
        <p class="muted"><${Html} tag="span" h=${t.desc} />${p.n ? ' · הצלחה '+pct(p.acc)+' ב־'+p.n+' שאלות' : ''}</p>
      </div>
      <button class="btn primary lg" onClick=${()=>go.practice(tid)}>תרגול: 10 שאלות</button>
    </div>
    <article class="card learn"><${Html} h=${t.learn} cls="learn-body" /></article>
    <div class="row" style=${{justifyContent:'center'}}><button class="btn primary lg" onClick=${()=>go.practice(tid)}>הבנתי, בואו נתרגל</button></div>
  </div>`;
}

// ---------- Parent dashboard ----------
function Trend({d}){ if(d==null) return html`<span class="trend flat">—</span>`; if(d>0.1) return html`<span class="trend up" title="משתפרת">▲</span>`; if(d<-0.1) return html`<span class="trend down" title="ירידה">▼</span>`; return html`<span class="trend flat" title="יציב">●</span>`; }
function Parent({stats,store,go}){
  const [open,setOpen]=useState({});
  const [confirm,setConfirm]=useState(false);
  const [nm,setNm]=useState(store.name||'');
  const all=stats.all; const sessions=store.sessions;
  const firstOk = rate(all);
  const minutes = Math.round(all.reduce((a,x)=>a+(x.ms||0),0)/60000);
  const days = new Set(sessions.map(s=>new Date(s.t).toDateString())).size;
  const rows = TOPICS.map(t=>stats.per[t.id]);
  const focus = rows.filter(p=>p.status==='weak'||p.status==='mid').sort((a,b)=>a.acc-b.acc).slice(0,4);
  const untouched = rows.filter(p=>p.n===0);
  const strong = rows.filter(p=>p.status==='strong');
  const mistakes = all.filter(x=>!x.ok).slice(-15).reverse();
  const syncTxt = store.status==='synced' ? 'נשמר בענן · מתעדכן מכל מכשיר' : store.status==='loading' ? 'טוען נתונים…' : 'נשמר במכשיר הזה';
  const syncCol = store.status==='synced' ? 'var(--ok)' : store.status==='loading' ? 'var(--warn)' : 'var(--faint)';
  const examLast = sessions.filter(s=>s.mode==='exam')[0];

  return html`<div class="page">
    <div class="panel-h">
      <div style=${{display:'flex',flexDirection:'column',gap:'4px'}}>
        <div class="eyebrow">לוח מעקב להורים</div>
        <h1>${store.name ? 'ההתקדמות של '+store.name : 'מה כבר שולטים בו ומה צריך לחזק'}</h1>
      </div>
      <span class="sync" style=${{'--sync':syncCol}}>${syncTxt}</span>
    </div>

    ${all.length===0 ? html`<div class="card empty">
      <h2>עוד אין נתונים</h2>
      <p>אחרי התרגול הראשון יופיעו כאן אחוזי הצלחה לכל נושא, הטעויות והמלצות למה לתרגל.</p>
      <button class="btn primary" onClick=${go.smart}>להתחיל תרגול חכם</button>
    </div>` : html`
    <div class="kpis">
      <div class="card kpi"><span class="l">שאלות שנפתרו</span><span class="v">${all.length}</span></div>
      <div class="card kpi"><span class="l">הצלחה בניסיון ראשון</span><span class="v">${pct(firstOk)}</span></div>
      <div class="card kpi"><span class="l">זמן תרגול</span><span class="v">${minutes}<small style=${{fontSize:'1rem'}}> דק׳</small></span></div>
      <div class="card kpi"><span class="l">ימי תרגול${examLast ? ' · מבחן אחרון' : ''}</span><span class="v">${days}${examLast ? html`<small style=${{fontSize:'1rem'}} class="muted"> · <bdi dir="ltr">${examLast.score}/${examLast.total}</bdi></small>` : ''}</span></div>
    </div>

    <div class="card panel">
      <div class="panel-h"><h2>מה כדאי לתרגל עכשיו</h2>
        <button class="btn primary" onClick=${go.smart}>תרגול חכם על החולשות</button></div>
      ${focus.length ? html`<div class="focus-list">${focus.map(p=>{ const t=TOPIC[p.id]; const ws=weakestSkill(p); return html`<div class=${'focus '+t.sub} key=${p.id}>
        <div class="row" style=${{justifyContent:'space-between'}}><b>${t.name}</b><span class=${'pill '+STATUS[p.status].cls}>${pct(p.acc)}</span></div>
        <small>${ws ? 'הכי קשה: '+ws : SUBJ[t.sub]}</small>
        <button class="btn" onClick=${()=>go.practice(p.id,true)}>תרגול ממוקד</button>
      </div>`; })}</div>`
      : html`<p class="muted">אין כרגע נושא שמתחת ל־85% הצלחה. ${untouched.length ? 'נשארו נושאים שעוד לא תורגלו: '+untouched.map(p=>TOPIC[p.id].name).join(', ')+'.' : 'כל הכבוד!'}</p>`}
      ${focus.length && untouched.length ? html`<p class="muted" style=${{fontSize:'.9rem'}}>עוד לא תורגלו: ${untouched.map(p=>TOPIC[p.id].name).join(', ')}</p>` : null}
      ${strong.length ? html`<p class="muted" style=${{fontSize:'.9rem'}}>שליטה טובה ב: ${strong.map(p=>TOPIC[p.id].name).join(', ')}</p>` : null}
    </div>

    <div class="card panel">
      <div class="panel-h"><h2>כל הנושאים</h2><span class="muted" style=${{fontSize:'.85rem'}}>אחוז ההצלחה מחושב מ־20 השאלות האחרונות בכל נושא</span></div>
      ${['math','geo'].map(sub=>html`<div class=${'ttable '+sub} key=${sub}>
        <div class="trow head"><span>${SUBJ[sub]}</span><span>מצב</span><span class="c-bar">הצלחה</span><span>%</span><span class="c-trend">מגמה</span><span></span></div>
        ${rows.filter(p=>TOPIC[p.id].sub===sub).map(p=>{ const t=TOPIC[p.id]; const st=p.status==='few'?'new':p.status; return html`<${React.Fragment} key=${p.id}>
          <div class="trow">
            <span class="tn">${t.name}<small class="muted">${p.n? p.n+' ש׳' : ''}</small></span>
            <span><span class=${'pill '+STATUS[p.status].cls}>${STATUS[p.status].label}</span></span>
            <span class="c-bar"><div class=${'meter st st-'+st}><i style=${{width:((p.acc||0)*100)+'%'}}></i></div></span>
            <span>${pct(p.acc)}</span>
            <span class="c-trend"><${Trend} d=${p.trend} /></span>
            <button class="exp" aria-expanded=${!!open[p.id]} aria-label="פירוט מיומנויות" onClick=${()=>setOpen(o=>Object.assign({},o,{[p.id]:!o[p.id]}))}>${open[p.id]?'▴':'▾'}</button>
            ${open[p.id] ? html`<div class="skills">
              ${p.skillList.map(s=>html`<div class="skrow" key=${s.name}>
                <span>${s.name}</span>
                <div class=${'meter st st-'+(s.status==='few'?'new':s.status)}><i style=${{width:((s.acc||0)*100)+'%'}}></i></div>
                <span class="muted">${s.n ? pct(s.acc)+' · '+s.n : 'לא תורגל'}</span>
              </div>`)}
              <div class="row"><button class="btn" onClick=${()=>go.practice(p.id,true)}>תרגול ממוקד בנושא</button></div>
            </div>` : null}
          </div>
        </${React.Fragment}>`; })}
      </div>`)}
    </div>

    <div class="two">
      <div class="card panel">
        <h2>טעויות אחרונות</h2>
        ${mistakes.length ? html`<div class="mist">${mistakes.map((m,k)=>html`<div class="mrow" key=${k}>
          <span class="q">${m.q}</span>
          <span class="ans"><span class="given">התשובה שניתנה: <b><bdi dir=${isHeb(m.given)?'rtl':'ltr'}>${m.given||'—'}</bdi></b></span><span class="corr">נכון: <b><bdi dir=${isHeb(m.correct)?'rtl':'ltr'}>${m.correct}</bdi></b></span></span>
          <span class="muted" style=${{fontSize:'.8rem'}}>${TOPIC[m.topic]?TOPIC[m.topic].name:''}</span>
        </div>`)}</div>` : html`<p class="muted">אין טעויות עד עכשיו.</p>`}
      </div>
      <div class="card panel">
        <h2>היסטוריית תרגולים</h2>
        <div class="hist">${sessions.slice(0,25).map(s=>html`<div class="hrow" key=${s.id}>
          <span class="muted">${fmtDate(s.t)}</span>
          <span>${MODE[s.mode]||''} · ${s.title}</span>
          <bdi dir="ltr" style=${{fontWeight:700}}>${s.score}/${s.total}</bdi>
          <span class="muted c-time">${Math.max(1,Math.round((s.items||[]).reduce((a,x)=>a+(x.ms||0),0)/60000))} דק׳</span>
        </div>`)}</div>
      </div>
    </div>`}

    <div class="card panel">
      <h2>הגדרות</h2>
      <div class="row" style=${{alignItems:'flex-end'}}>
        <div class="field"><label for="child-name">שם הילד/ה (לברכה במסך הבית)</label>
          <input id="child-name" value=${nm} onInput=${e=>setNm(e.target.value)} maxlength="24" /></div>
        <button class="btn" onClick=${()=>store.setName(nm.trim())}>שמירה</button>
      </div>
      ${confirm ? html`<div class="confirm"><span>למחוק את כל היסטוריית התרגול? אי אפשר לשחזר.</span>
        <button class="btn" style=${{borderColor:'var(--bad)',color:'var(--bad)'}} onClick=${()=>{ store.reset(); setConfirm(false); }}>כן, למחוק</button>
        <button class="btn ghost" onClick=${()=>setConfirm(false)}>ביטול</button></div>`
        : html`<div><button class="btn ghost" onClick=${()=>setConfirm(true)}>איפוס כל הנתונים</button></div>`}
    </div>
  </div>`;
}

// ---------- App ----------
function App(){
  const store=useStore();
  const stats=useMemo(()=>computeStats(store.sessions),[store.version]);
  const [view,setView]=useState('home');
  const [tid,setTid]=useState(null);
  const [cfg,setCfg]=useState(null);
  const [res,setRes]=useState(null);
  useEffect(()=>{ window.scrollTo(0,0); },[view,tid]);

  function startQuiz(c){ setCfg(Object.assign({key:Date.now()},c)); setView('quiz'); }
  const go={
    home:()=>setView('home'),
    parent:()=>setView('parent'),
    topic:(id)=>{ setTid(id); setView('topic'); },
    practice:(id,focus)=>startQuiz({mode:'practice',title:TOPIC[id].name,plan:practicePlan(id,stats,focus),again:{type:'practice',id,focus}}),
    smart:()=>startQuiz({mode:'smart',title:'כל הנושאים',plan:smartPlan(stats),again:{type:'smart'}}),
    exam:(sub)=>startQuiz({mode:'exam',title:sub==='all'?'משולב':SUBJ[sub],plan:examPlan(sub),again:{type:'exam',sub}}),
  };
  function onFinish(items){
    const score=items.filter(x=>x.ok).length;
    store.addSession({t:Date.now(),mode:cfg.mode,title:cfg.title,total:items.length,score,items});
    setRes({mode:cfg.mode,title:cfg.title,items,again:cfg.again}); setView('result');
  }
  function again(){ const a=res.again; if(a.type==='practice') go.practice(a.id,a.focus); else if(a.type==='smart') go.smart(); else go.exam(a.sub); }

  const inParent = view==='parent';
  let body;
  if(view==='quiz' && cfg) body=html`<div class="page"><${Quiz} key=${cfg.key} cfg=${cfg} onExit=${()=>setView(tid&&cfg.mode==='practice'?'topic':'home')} onFinish=${onFinish} /></div>`;
  else if(view==='result' && res) body=html`<div class="page"><${Result} res=${res} name=${store.name} onAgain=${again} onHome=${go.home} onParent=${go.parent} /></div>`;
  else if(view==='topic' && tid) body=html`<${TopicPage} tid=${tid} stats=${stats} go=${go} />`;
  else if(inParent) body=html`<${Parent} stats=${stats} store=${store} go=${go} />`;
  else body=html`<${Home} stats=${stats} name=${store.name} go=${go} />`;

  return html`<${React.Fragment}>
    <header class="topbar"><div class="topbar-in">
      <button class="brand" onClick=${go.home}><span class="logo" aria-hidden="true">+</span><span class="bt">מחברת חזרה</span></button>
      <nav class="seg" aria-label="מצב">
        <button aria-pressed=${!inParent} onClick=${go.home}>תרגול</button>
        <button aria-pressed=${inParent} onClick=${go.parent}>לוח מעקב להורים</button>
      </nav>
    </div></header>
    <main>${body}</main>
  </${React.Fragment}>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
Store.init();
})();

</script>
</body></html>
